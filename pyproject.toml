[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palette-multi-agent"
version = "0.1.0"
description = "A configurable multi-agent orchestration framework built with LangGraph"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "PyYAML>=6.0",
    "PyQt6>=6.7",
    "langgraph",
    "langchain-core",
    "langchain-ollama",
    "langchain-openai",
    "langchain-anthropic",
    "python-dotenv"
]

[project.scripts]
palette = "frontend.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["palettle*", "frontend*"]